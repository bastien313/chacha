<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Une journée d'infirmière… piquante</title>
<meta name="description" content="Une infirmière part au travail, se transforme en moustique, pique ses patients et rentre faire un bisou à son mari.">
<meta name="theme-color" content="#120c26">
<meta property="og:title" content="Une journée d'infirmière… piquante">
<meta property="og:description" content="Dessin animé : infirmière le jour, moustique au boulot, amoureuse le soir.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦟%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1d3a;--pink:#ff5d8f;--gold:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#120c26;overflow:hidden;color:#fff;
  font-family:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:fixed;inset:0;display:grid;place-items:center}
canvas{display:block;background:#000;box-shadow:0 10px 60px rgba(0,0,0,.55)}
.ctrl{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));
  display:none;gap:8px;z-index:5}
.ctrl button{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.35);
  background:rgba(20,12,40,.7);color:#fff;font-size:20px;cursor:pointer;backdrop-filter:blur(4px)}
.ctrl button:active{transform:scale(.92)}
.overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:10;
  background:radial-gradient(120% 90% at 50% 40%,#3a1f5e 0%,#120c26 70%)}
.card{text-align:center;padding:24px;max-width:680px}
.mos{font-size:76px;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));animation:fly 2.4s ease-in-out infinite}
@keyframes fly{50%{transform:translate(10px,-10px) rotate(6deg)}}
h1{font-size:clamp(26px,5vw,40px);margin:14px 0 8px;line-height:1.1}
h1 em{font-style:normal;color:var(--pink)}
.card p{opacity:.85;margin-bottom:22px;font-size:clamp(15px,2.4vw,18px);line-height:1.4}
.btn{font:inherit;font-weight:700;font-size:20px;padding:13px 34px;border-radius:999px;border:0;cursor:pointer;
  color:#fff;background:linear-gradient(135deg,#ff5d8f,#ff8a5b);box-shadow:0 8px 24px rgba(255,93,143,.45)}
.btn:active{transform:scale(.96)}
.card small{display:block;margin-top:14px;opacity:.6}
#again{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);z-index:6;display:none}
#rot{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:13px;opacity:.7;display:none;z-index:4}
@media (orientation:portrait) and (max-width:700px){#rot{display:block}}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="1280" height="720" aria-label="Dessin animé : une infirmière se transforme en moustique au travail"></canvas></div>
<div id="rot">📱 Astuce : tourne ton téléphone à l'horizontale</div>
<div class="ctrl" id="ctrl">
  <button id="bPause" title="Pause">⏸</button>
  <button id="bRestart" title="Recommencer">↺</button>
  <button id="bSound" title="Son">🔊</button>
</div>
<button class="btn" id="again">↺ Rejouer</button>
<div class="overlay" id="start">
  <div class="card">
    <div class="mos">🦟</div>
    <h1>Une journée d'infirmière… <em>piquante</em></h1>
    <p>Elle part au travail le matin, se transforme, gagne sa vie à sa façon, puis rentre retrouver son mari.</p>
    <button class="btn" id="go">▶ Lancer l'histoire</button>
    <small>🔊 Avec le son, c'est mieux</small>
  </div>
</div>

<script>
(()=>{
'use strict';

/* ===================== RÉGLAGES ===================== */
const CFG={
  to:'Charlène',            // dédicace sur l'écran de fin ('' pour l'enlever)
  amounts:[5,8,6,10]        // € gagnés à chaque piqûre (4 patients)
};

/* ===================== OUTILS ===================== */
const W=1280,H=720,PI=Math.PI,TAU=PI*2;
const FONT="'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif";
const OUT='#2b1d3a';
const cv=document.getElementById('cv'),c=cv.getContext('2d');
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eIO=t=>t<.5?2*t*t:1-2*(1-t)*(1-t);
const eO=t=>1-Math.pow(1-t,3);
const eI=t=>t*t;
const eBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const _rgb={};
const rgb=h=>_rgb[h]||(_rgb[h]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
const mixc=(a,b,t)=>{const A=rgb(a),B=rgb(b);return `rgb(${(A[0]+(B[0]-A[0])*t)|0},${(A[1]+(B[1]-A[1])*t)|0},${(A[2]+(B[2]-A[2])*t)|0})`};
const pop=(t,a,b)=>eBack(seg(t,a,a+.3))*(1-eI(seg(t,b,b+.25)));

function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fs(fill,lw=3,stroke=OUT){if(fill){c.fillStyle=fill;c.fill()}if(lw){c.strokeStyle=stroke;c.lineWidth=lw;c.lineJoin='round';c.stroke()}}
function circ(x,y,r,fill,lw){c.beginPath();c.arc(x,y,Math.max(0,r),0,TAU);fs(fill,lw)}
function ell(x,y,rx,ry,fill,lw,rot=0){c.beginPath();c.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),rot,0,TAU);fs(fill,lw)}
function box(x,y,w,h,fill,lw){c.beginPath();c.rect(x,y,w,h);fs(fill,lw)}
function limb(pts,w,col){
  c.lineCap='round';c.lineJoin='round';
  for(const [sty,lw] of [[OUT,w+6],[col,w]]){
    c.strokeStyle=sty;c.lineWidth=lw;c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.stroke();
  }
}
function heart(x,y,s,fill,a=1){
  c.save();c.translate(x,y);c.scale(s,s);c.globalAlpha*=a;c.beginPath();
  c.moveTo(0,.9);c.bezierCurveTo(-1.3,0,-1.1,-1,-.4,-1);c.bezierCurveTo(-.1,-1,0,-.8,0,-.6);
  c.bezierCurveTo(0,-.8,.1,-1,.4,-1);c.bezierCurveTo(1.1,-1,1.3,0,0,.9);
  c.fillStyle=fill;c.fill();c.restore();
}
function star(x,y,R,rot,fill){
  c.save();c.translate(x,y);c.rotate(rot);c.beginPath();
  for(let i=0;i<8;i++){const r=i%2?R*.32:R,a=i*PI/4;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
  c.closePath();c.fillStyle=fill;c.fill();c.restore();
}
function text(s,x,y,size,fill,o={}){
  c.save();c.font=`700 ${size}px ${FONT}`;c.textAlign=o.align||'center';c.textBaseline='middle';c.lineJoin='round';
  if(o.stroke){c.strokeStyle=o.stroke;c.lineWidth=o.sw||6;c.strokeText(s,x,y)}
  c.fillStyle=fill;c.fillText(s,x,y);c.restore();
}
function bubble(x,y,str,p,o={}){
  if(p<=0.01)return;
  const f=o.fs||26;c.save();c.font=`700 ${f}px ${FONT}`;
  const lines=str.split('\n'),w=Math.max(...lines.map(l=>c.measureText(l).width))+34,h=lines.length*f*1.15+20;
  const bx=clamp(x-w/2,10,W-w-10),by=y-30-h;
  c.translate(x,y);c.scale(p,p);c.translate(-x,-y);c.globalAlpha=clamp(p*2);
  c.strokeStyle=OUT;c.lineWidth=3.5;c.lineJoin='round';
  c.beginPath();c.moveTo(x-10,by+h-2);c.lineTo(x,y);c.lineTo(x+13,by+h-2);c.stroke();
  rr(bx,by,w,h,18);c.fillStyle='#fff';c.fill();c.stroke();
  c.beginPath();c.moveTo(x-8,by+h-1.5);c.lineTo(x,y-3);c.lineTo(x+11,by+h-1.5);c.fillStyle='#fff';c.fill();
  c.fillStyle=OUT;c.textAlign='center';c.textBaseline='middle';
  lines.forEach((l,i)=>c.fillText(l,bx+w/2,by+10+f*.575+i*f*1.15+2));
  c.restore();
}

/* ===================== CHRONOLOGIE ===================== */
const D={A:10.5,B:8.4,C:38,D:8,E:15.5};
const S={A:0};S.B=S.A+D.A;S.C=S.B+D.B;S.D=S.C+D.C;S.E=S.D+D.D;
const TOTAL=S.E+D.E;
function hourAt(T){
  if(T<S.B)return lerp(7.15,7.7,(T-S.A)/D.A);
  if(T<S.C)return lerp(7.92,8.0,(T-S.B)/D.B);
  if(T<S.D)return 8+10*seg(T-S.C,6.8,30);
  if(T<S.E)return lerp(18.05,18.3,(T-S.D)/D.D);
  return lerp(18.8,19.4,(T-S.E)/D.E);
}
/* Cycle « piqûre » (relatif au début de la scène C) */
const CYC0=7.0,PER=5.5;
const BX=[190,470,750,1030],BY=590;
const ARR=CFG.amounts.map((_,i)=>S.C+CYC0+PER*i+5.2);          // instant d'arrivée de chaque pièce dans le compteur
const moneyAt=T=>Math.round(CFG.amounts.reduce((s,a,i)=>s+a*seg(T,ARR[i]-.05,ARR[i]+.45),0));

/* ===================== SON ===================== */
const AS={engine:0,buzz:0,belly:0};
let AC=null,mst=null,nzBuf=null,bz=null,en=null,soundOn=true,mNext=0,mStep=0;
function audioInit(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
  mst=AC.createGain();mst.gain.value=soundOn?.9:0;mst.connect(AC.destination);
  nzBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=nzBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=210;
  const lfo=AC.createOscillator();lfo.frequency.value=13;const lg=AC.createGain();lg.gain.value=22;lfo.connect(lg);lg.connect(o.frequency);
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=650;bp.Q.value=2.5;
  const g=AC.createGain();g.gain.value=0;o.connect(bp);bp.connect(g);g.connect(mst);o.start();lfo.start();bz={o,g};
  const e=AC.createOscillator();e.type='sawtooth';e.frequency.value=60;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;
  const eg=AC.createGain();eg.gain.value=0;e.connect(lp);lp.connect(eg);eg.connect(mst);e.start();en={o:e,g:eg};
}
function audioTick(playing){
  if(!AC)return;const n=AC.currentTime,k=playing?1:0;
  bz.g.gain.setTargetAtTime(.05*AS.buzz*k,n,.05);bz.o.frequency.setTargetAtTime(215-55*AS.belly,n,.1);
  en.g.gain.setTargetAtTime(.055*AS.engine*k,n,.08);en.o.frequency.setTargetAtTime(48+55*AS.engine,n,.1);
}
function tone(f,d,type='sine',v=.08,at=0,to=null){
  if(!AC||!soundOn)return;const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(mst);o.start(t);o.stop(t+d+.05);
}
function noise(d,f0,f1,v,type='lowpass',at=0){
  if(!AC||!soundOn)return;const t=AC.currentTime+at,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nzBuf;f.type=type;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(mst);s.start(t);s.stop(t+d+.05);
}
const SFX={
  coin(){tone(988,.09,'square',.045);tone(1319,.3,'square',.045,.08)},
  pouf(){noise(.55,2600,180,.22);[880,1175,1568,2093].forEach((f,i)=>tone(f,.25,'triangle',.05,i*.06))},
  ouch(){tone(950,.28,'triangle',.09,0,480)},
  ding(){tone(1046,.16,'sine',.09);tone(1568,.5,'sine',.07,.13)},
  mwah(){noise(.09,4500,1500,.25,'highpass');tone(1300,.14,'sine',.09,0,520)},
  jingle(){[523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.08,i*.13));[523,659,784,1047].forEach(f=>tone(f,.9,'triangle',.05,.6))}
};
const EV=[];const ev=(t,n)=>EV.push({t,n});
ev(S.B+6.4,'ding');ev(S.C+5.2+.55*1.4,'pouf');ev(S.C+30.6+.55*1.4,'pouf');ev(S.D+.5,'ding');ev(S.E+10.55,'mwah');ev(S.E+12.6,'jingle');
CFG.amounts.forEach((_,i)=>{ev(S.C+CYC0+PER*i+3.95,'ouch');ev(ARR[i],'coin')});
const CHORDS=[[130.81,[261.63,329.63,392]],[110,[261.63,329.63,440]],[87.31,[261.63,349.23,440]],[98,[246.94,293.66,392]]];
function musicTick(playing){
  if(!AC||!soundOn||!playing){if(AC)mNext=AC.currentTime+.1;return}
  while(mNext<AC.currentTime+.3){
    const ch=CHORDS[((mStep/8)|0)%4],k=mStep%8,at=mNext-AC.currentTime;
    tone(ch[1][[0,1,2,1,0,1,2,1][k]],.32,'triangle',.03,at);
    if(k===0||k===4)tone(ch[0],.42,'sine',.055,at);
    mNext+=.21;mStep++;
  }
}

/* ===================== CIEL, DÉCOR EXTÉRIEUR ===================== */
const SKY=[[6.3,'#3d4a8f','#ffa877'],[7.2,'#5d8fd6','#ffd1a0'],[8.5,'#4fa3ec','#cfeeff'],[16,'#4fa3ec','#d8f0ff'],
  [17.7,'#5f86d8','#ffd39b'],[18.5,'#7b5aa8','#ff8f6b'],[19.1,'#4a3c85','#d9648a'],[19.7,'#1c2260','#5a3c86'],[20.5,'#0c1233','#1f2360']];
function skyCols(h){
  let k=0;while(k<SKY.length-2&&h>=SKY[k+1][0])k++;
  const a=SKY[k],b=SKY[k+1],t=clamp((h-a[0])/(b[0]-a[0]));
  return[mixc(a[1],b[1],t),mixc(a[2],b[2],t)];
}
const nightOf=h=>seg(h,18.7,19.7);
let NIGHT=0;
const sunsetOf=h=>Math.max(0,1-Math.abs(h-18.4)/.9);
function cloud(x,y,s,col){
  c.save();c.translate(x,y);c.scale(s,s);c.fillStyle=col;c.beginPath();
  for(const [x,y,r] of [[0,0,30],[30,-12,26],[-32,4,22],[58,6,20]]){c.moveTo(x+r,y);c.arc(x,y,r,0,TAU)}
  c.rect(-32,0,90,26);c.fill();c.restore();
}
function tree(x,y,s,T,i){
  c.save();c.translate(x,y);c.scale(s,s);const sw=Math.sin(T*.8+i)*2;
  box(-7,-70,14,72,'#8a5a3b',3);
  circ(sw-24,-96,34,'#4fae68',3);circ(sw+26,-92,32,'#4fae68',3);circ(sw,-126,40,'#5fc57a',3);
  circ(sw-10,-134,12,'rgba(255,255,255,.18)',0);c.restore();
}
function hillsPath(base,amp,col,ph,fr){
  c.beginPath();c.moveTo(0,H);
  for(let x=0;x<=W;x+=16)c.lineTo(x,base-amp*(.5+.5*Math.sin(x*fr+ph))-amp*.3*Math.sin(x*fr*2.3+ph*1.7));
  c.lineTo(W,H);c.closePath();c.fillStyle=col;c.fill();
}
function exterior(T,h,trees){
  const [top,bot]=skyCols(h),n=nightOf(h),sun=sunsetOf(h);NIGHT=n;
  const g=c.createLinearGradient(0,0,0,520);g.addColorStop(0,top);g.addColorStop(1,bot);c.fillStyle=g;c.fillRect(0,0,W,H);
  if(n>0)for(let i=0;i<70;i++){
    c.fillStyle=`rgba(255,255,255,${n*(.35+.65*Math.abs(Math.sin(T*1.6+i*1.7)))})`;
    c.beginPath();c.arc(rnd(i)*W,rnd(i+77)*330,1+rnd(i+9)*1.2,0,TAU);c.fill();
  }
  const u=(h-6.3)/12.7;
  if(u>-.06&&u<1.06){
    const sx=lerp(140,1140,u),sy=490-350*Math.sin(clamp(u,0,1)*PI);
    const gl=c.createRadialGradient(sx,sy,10,sx,sy,190);gl.addColorStop(0,`rgba(255,${(230-70*sun)|0},150,.55)`);gl.addColorStop(1,'rgba(255,200,120,0)');
    c.fillStyle=gl;c.fillRect(sx-200,sy-200,400,400);
    circ(sx,sy,44,mixc('#fff4a8','#ff9a5a',Math.max(sun,clamp(1-u*8))),0);
  }
  if(n>0){
    c.save();c.globalAlpha=n;const gl=c.createRadialGradient(960,140,10,960,140,150);
    gl.addColorStop(0,'rgba(255,250,220,.5)');gl.addColorStop(1,'rgba(255,250,220,0)');c.fillStyle=gl;c.fillRect(800,0,320,300);
    circ(960,140,38,'#f6f1d8',0);circ(948,132,7,'rgba(0,0,0,.08)',0);circ(972,150,9,'rgba(0,0,0,.08)',0);circ(966,122,4,'rgba(0,0,0,.08)',0);c.restore();
  }
  const cc=mixc('#ffffff','#ffc2ae',sun);
  c.save();c.globalAlpha=1-.75*n;
  for(let i=0;i<5;i++){
    const cx=((rnd(i)*W+T*(5+rnd(i+9)*7))%(W+360))-180;
    cloud(cx,70+rnd(i+5)*170,.7+rnd(i+3)*.8,cc);
  }
  c.restore();
  hillsPath(470,64,'#a6d5b6',1.2,.006);hillsPath(505,38,'#83cb8f',4,.009);
  const gg=c.createLinearGradient(0,510,0,600);gg.addColorStop(0,'#78ca74');gg.addColorStop(1,'#5db862');
  c.fillStyle=gg;c.fillRect(0,515,W,90);
  trees.forEach((x,i)=>tree(x,560,.95+rnd(i)*.25,T,i));
  c.fillStyle='#dcd6e8';c.fillRect(0,600,W,36);
  c.fillStyle='rgba(120,110,150,.25)';for(let x=0;x<W;x+=90)c.fillRect(x,600,3,36);
  c.fillStyle='#b3acc6';c.fillRect(0,634,W,5);
  c.fillStyle='#46436a';c.fillRect(0,639,W,H-639);
  c.fillStyle='#f3e9a6';for(let x=-20;x<W;x+=120)c.fillRect(x,688,64,7);
}
const GL=[];
function tint(h){
  const n=nightOf(h),sun=sunsetOf(h);
  if(sun>0){c.fillStyle=`rgba(255,120,50,${.16*sun})`;c.fillRect(-2000,-2000,5300,4700)}
  if(n>0){c.fillStyle=`rgba(14,18,75,${.5*n})`;c.fillRect(-2000,-2000,5300,4700)}
  for(const g of GL)g(n);
  GL.length=0;
}
function glowRect(x,y,w,h){
  GL.push(n=>{if(n<=.02)return;c.save();c.globalCompositeOperation='lighter';c.globalAlpha=n*.5;
    const g=c.createRadialGradient(x+w/2,y+h/2,4,x+w/2,y+h/2,Math.max(w,h)*1.2);
    g.addColorStop(0,'rgba(255,200,90,.55)');g.addColorStop(1,'rgba(255,200,90,0)');c.fillStyle=g;c.fillRect(x-w,y-h,w*3,h*3);
    c.fillStyle='rgba(255,190,80,.35)';c.fillRect(x,y,w,h);c.restore()});
}

/* ===================== MAISON ===================== */
function win(x,y,w,h,glow){
  rr(x-6,y-6,w+12,h+12,8);fs('#fff',3);

    bubble(650,FY-NS*175,'Bonne soirée à tous !',pop(lt,t2+1.6,t2+3.4));
  }
  const sun=seg(h,15.5,18.3);
  if(sun>0){c.fillStyle=`rgba(255,130,60,${.2*sun})`;c.fillRect(0,0,W,H)}
}
function sceneD(lt,T){
  const h=hourAt(T);
  exterior(T,h,[110,230,470]);
  const p=seg(lt,.9,4.9),nx=lerp(945,540,p),ny=lerp(596,626,eIO(seg(p,0,.1)));
  hospital(eIO(seg(lt,.3,.9))*(1-eIO(seg(lt,2.2,3.2))));
  const na=seg(lt,.7,1)*(1-seg(lt,4.85,5.15));
  if(na>0)human({kind:'nurse',x:nx,y:ny,f:-1,ph:-(nx-945)*TAU/100,walk:p>0&&p<1?1:0,a:na,t:T,eyes:'open',mouth:'smile'});
  const xOf=t=>t<5.6?560:560-860*eI(seg(t,5.6,8)),cx=xOf(lt),sp=clamp((560-cx)/300);
  car({x:cx,y:706,dir:-1,rot:(cx-560)/26,nurse:lt>5,shake:(lt>5&&lt<5.6)?1.2:0,bounce:sp>0?Math.abs(Math.sin(T*22))*1.6*sp:0,lights:lt>4.8,T});
  exhaust(xOf,706,-1,5,8,lt);
  AS.engine=lt>5?.3+.7*sp:0;
  tint(h);
}
function hearts(lt,a,x,y){
  for(let i=0;i<14;i++){
    const d=a+i*.13,u=(lt-d)/1.9;if(u<0||u>1)continue;
    heart(x+(rnd(i)-.5)*90+Math.sin(u*6+i)*14,y-u*170,7+rnd(i+9)*9,i%3?'#ff5d8f':'#e5344f',1-eI(u));
  }
}
function sceneE(lt,T){
  const h=hourAt(T);
  const k=eIO(seg(lt,9.3,10.5));
  c.save();
  c.translate(lerp(350,640,k),lerp(500,440,k));const z=1+.9*k;c.scale(z,z);c.translate(-350,-500);
  exterior(T,h,[540,600,1130,1215]);
  const open=eIO(seg(lt,5.4,6));
  const kiss=eIO(seg(lt,10,10.6)),tal=lt>6.3&&lt<8.3;
  house(T,open,()=>human({kind:'husband',x:322,y:590,s:1.08,f:1,arm:lt<8.6?'wave':'rest',t:T,eyes:'happy',mouth:tal?'talk':'smile',lean:.12*kiss,hx:5*kiss,blush:kiss}));
  const xOf=t=>t<.7?1500:lerp(1500,790,eO(seg(t,.7,4))),cx=xOf(lt),mv=lt>.7&&lt<4;
  const p=seg(lt,4.2,7.4),nx=lerp(760,378,p),ny=lerp(628,598,eIO(seg(p,.72,1)));
  if(lt>4.2)human({kind:'nurse',x:nx,y:ny,f:-1,ph:(nx-760)*TAU/100,walk:p<1?1:0,a:seg(lt,4.2,4.45),t:T,eyes:kiss>.5?'happy':'open',
    mouth:kiss>.5?'kiss':(lt>8&&lt<9.9?'talk':'smile'),lean:.2*kiss,hx:5*kiss,blush:kiss,lift:Math.max(0,Math.sin(seg(lt,4.2,4.6)*PI))*12+14*kiss});
  car({x:cx,y:706,dir:-1,rot:(cx-1500)/26,nurse:lt<4.1,brake:lt>3&&lt<4.3,bounce:mv?Math.abs(Math.sin(T*22))*1.4:0,lights:true,T});
  exhaust(xOf,706,-1,.7,4,lt);
  AS.engine=mv?.3+.6*(1-seg(lt,2.6,4)):0;
  tint(h);
  bubble(324,428,'Ta journée, ma chérie ?',pop(lt,6.3,8.3),{fs:24});
  bubble(384,436,'Piquante… euh, parfaite !',pop(lt,8.1,9.9),{fs:24});
  if(lt>10.4){hearts(lt,10.5,352,440);const p2=pop(lt,10.5,12.3);c.save();c.translate(352,372);c.rotate(-.08);c.scale(p2,p2);text('MWAH !',0,0,36,'#ff5d8f',{stroke:'#fff',sw:8});c.restore()}
  c.restore();
  // écran de fin
  const e=seg(lt,12.9,14.2);
  if(e>0){
    c.fillStyle=`rgba(18,10,40,${.62*e})`;c.fillRect(0,0,W,H);
    c.save();c.globalAlpha=e;
    heart(W/2,236,62+Math.sin(T*5)*3,'#ff5d8f');
    text('FIN',W/2,352,74,'#fff',{stroke:OUT,sw:10});
    text('Salaire du jour : '+moneyAt(T)+' €',W/2,428,36,'#ffd23f',{stroke:OUT,sw:7});
    text('et un bisou en prime.',W/2,472,26,'#fff',{});
    if(CFG.to)text('Une histoire pour '+CFG.to,W/2,514,22,'#ffb3cd',{});
    c.restore();
  }
}
const SCENES=[
  {id:'A',s:S.A,d:D.A,fn:sceneA},{id:'B',s:S.B,d:D.B,fn:sceneB},{id:'C',s:S.C,d:D.C,fn:sceneC},
  {id:'D',s:S.D,d:D.D,fn:sceneD},{id:'E',s:S.E,d:D.E,fn:sceneE}
];
const CAPS=[
  ['A',.8,4.4,'Ce matin, direction l\'hôpital…'],['B',.9,3.3,'Une journée comme les autres ?'],
  ['C',6.7,9.2,'Mode moustique : activé !'],['C',18.5,21,'Elle pique. Elle encaisse.'],
  ['D',.9,4,'Journée terminée !'],['E',.9,3.6,'Et retour à la maison…']
];

/* ===================== INTERFACE (HUD) ===================== */
function hud(T,h){
  const hr=Math.floor(h),mn=Math.floor((h-hr)*60),str=String(hr).padStart(2,'0')+':'+String(mn).padStart(2,'0');
  rr(20,18,142,52,26);c.fillStyle='rgba(18,10,40,.62)';c.fill();
  circ(50,44,15,'#fff',2.5);c.strokeStyle=OUT;c.lineWidth=2.4;c.lineCap='round';
  const hh=(h%12)/12*TAU-PI/2,mm=(h%1)*TAU-PI/2;
  c.beginPath();c.moveTo(50,44);c.lineTo(50+Math.cos(hh)*8,44+Math.sin(hh)*8);c.moveTo(50,44);c.lineTo(50+Math.cos(mm)*12,44+Math.sin(mm)*12);c.stroke();
  text(str,112,45,28,'#fff',{});
  let pp=0;for(const a of ARR)pp=Math.max(pp,Math.sin(PI*seg(T,a,a+.35)));
  c.save();c.translate(1170,44);c.scale(1+.22*pp,1+.22*pp);c.translate(-1170,-44);
  rr(1084,18,172,52,26);c.fillStyle='rgba(18,10,40,.62)';c.fill();
  coin(1116,44,17,0);text(moneyAt(T)+' €',1200,45,30,'#ffd23f',{});
  c.restore();
}
function caption(sc,lt){
  for(const [id,a,b,s] of CAPS){
    if(id!==sc.id)continue;const al=Math.min(seg(lt,a,a+.4),1-seg(lt,b-.4,b));if(al<=0)continue;
    c.save();c.globalAlpha=al;c.font=`700 28px ${FONT}`;const w=c.measureText(s).width+56;
    rr(W/2-w/2,22,w,52,26);c.fillStyle='rgba(18,10,40,.68)';c.fill();text(s,W/2,49,28,'#fff',{});c.restore();
  }
}

/* ===================== MOTEUR ===================== */
let K=1,T=0,playing=false,last=0,started=false;
const el=id=>document.getElementById(id);
function fit(){
  const sc=Math.min(innerWidth/W,innerHeight/H),cw=Math.floor(W*sc),ch=Math.floor(H*sc),dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);K=cv.width/W;
}
function render(t){
  c.setTransform(K,0,0,K,0,0);
  GL.length=0;AS.engine=0;AS.buzz=0;AS.belly=0;
  let sc=SCENES[0];for(const s of SCENES)if(t>=s.s)sc=s;
  const lt=t-sc.s;
  c.save();c.beginPath();c.rect(0,0,W,H);c.clip();sc.fn(lt,t);c.restore();
  let fa=0;if(lt<.6)fa=1-lt/.6;if(lt>sc.d-.6&&sc.id!=='E')fa=Math.max(fa,(lt-(sc.d-.6))/.6);
  if(fa>0){c.fillStyle=`rgba(10,6,24,${fa})`;c.fillRect(0,0,W,H)}
  hud(t,hourAt(t));caption(sc,lt);
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&started){
    const prev=T;T=Math.min(T+dt,TOTAL);
    for(const e of EV)if(e.t>prev&&e.t<=T)SFX[e.n]&&SFX[e.n]();
    if(T>=TOTAL){playing=false;el('bPause').textContent='▶';el('again').style.display='block'}
  }
  render(T);audioTick(playing&&started);
  requestAnimationFrame(frame);
}
function restart(){T=0;playing=true;el('again').style.display='none';el('bPause').textContent='⏸';if(AC&&AC.state==='suspended')AC.resume()}
function setSound(on){soundOn=on;if(mst)mst.gain.value=on?.9:0;el('bSound').textContent=on?'🔊':'🔇'}
function togglePause(){
  if(T>=TOTAL){restart();return}
  playing=!playing;el('bPause').textContent=playing?'⏸':'▶';
  if(AC){playing?AC.resume():AC.suspend()}
}
el('go').onclick=()=>{
  audioInit();if(AC&&AC.state==='suspended')AC.resume();
  el('start').style.display='none';el('ctrl').style.display='flex';started=true;playing=true;
  setInterval(()=>musicTick(playing),80);
};
el('bPause').onclick=togglePause;
el('bRestart').onclick=restart;
el('bSound').onclick=()=>setSound(!soundOn);
el('again').onclick=restart;
cv.onclick=()=>{if(started)togglePause()};
addEventListener('keydown',e=>{if(e.code==='Space'&&started){e.preventDefault();togglePause()}});
addEventListener('resize',fit);
fit();
// Aperçu direct d'un instant : index.html?t=25
const q=new URLSearchParams(location.search);
if(q.has('t')){T=clamp(parseFloat(q.get('t'))||0,0,TOTAL);el('start').style.display='none';el('ctrl').style.display='flex';started=true;playing=false}
window.__setT=v=>{T=v;render(T)};
if(document.fonts&&document.fonts.load)document.fonts.load('700 24px Fredoka').catch(()=>{});
requestAnimationFrame(t=>{last=t;frame(t)});
})();
</script>
