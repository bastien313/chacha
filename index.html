<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Charlène, mon amour ❤</title>
<meta name="description" content="Appuie pour faire battre mon cœur et récupère ta récompense…">
<meta name="theme-color" content="#1a0414">
<meta property="og:title" content="Pour Charlène ❤">
<meta property="og:description" content="Appuie pour faire battre mon cœur et récupère ta récompense…">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E❤️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#ff3d7f; --gold:#ffd166; --cream:#fff1f5;
  --script:'Great Vibes','Snell Roundhand','Brush Script MT',cursive;
  --sans:'Quicksand',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;color:var(--cream);font-family:var(--sans);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
body{background:radial-gradient(120% 90% at 50% 42%,#4d0e35 0%,#26061c 45%,#0d020a 100%)}
#app{position:fixed;left:0;top:0;width:100%;height:100%;will-change:transform}
canvas.layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:50}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ---------- Titre ---------- */
#title{position:absolute;top:calc(env(safe-area-inset-top,0px) + 3.5vh);left:0;right:0;text-align:center;padding:0 5vw;
  pointer-events:none;transition:opacity .9s,transform .9s;z-index:5}
#title.gone{opacity:0;transform:translateY(-30px)}
.grad{background:linear-gradient(90deg,#ff9ebd,#fff,#ff5c8a,#ffd1e0,#ff9ebd);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}
#title .n1{display:block;font-family:var(--script);font-size:clamp(3.2rem,14vmin,7rem);line-height:1;
  filter:drop-shadow(0 0 16px rgba(255,60,120,.65))}
#title .n2{display:block;font-family:var(--script);font-size:clamp(1.7rem,7vmin,3.4rem);line-height:1.05;margin-top:-.1em;
  filter:drop-shadow(0 0 12px rgba(255,60,120,.55))}
#title .sub{margin-top:1.6vh;font-size:clamp(.95rem,2.5vmin,1.3rem);font-weight:500;letter-spacing:.02em;opacity:.95;
  animation:pulseText 2.2s ease-in-out infinite;text-shadow:0 0 14px rgba(255,80,140,.6)}

/* ---------- Indications & jauge ---------- */
#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 13vh);text-align:center;padding:0 6vw;
  font-size:clamp(1.05rem,3vmin,1.6rem);font-weight:700;text-shadow:0 0 16px rgba(255,60,120,.8);pointer-events:none;z-index:5;min-height:1.6em}
#hint.pop{animation:hintPop .45s cubic-bezier(.2,1.8,.4,1)}
#hint.big{font-family:var(--script);font-weight:400;font-size:clamp(2rem,8vmin,4rem);line-height:1.1;animation:hintBig 1s cubic-bezier(.2,1.6,.4,1) both}
#meter{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 4.5vh);transform:translateX(-50%);
  width:min(78vw,380px);z-index:5;pointer-events:none;transition:opacity .8s}
#meter.gone{opacity:0}
#meter .lbl{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:6px}
#meter .bar{height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 0 8px rgba(0,0,0,.5),0 0 18px rgba(255,60,120,.25)}
#meter .bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .35s cubic-bezier(.2,1.4,.4,1);
  background:linear-gradient(90deg,#ff5c8a,#ff2d6f,#ffb3c8,#ff2d6f);background-size:200% 100%;animation:barFlow 1.4s linear infinite;box-shadow:0 0 14px #ff2d6f}

#mute{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:42px;height:42px;border-radius:50%;z-index:60;
  background:rgba(255,255,255,.1);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:1.15rem;line-height:42px;text-align:center;
  border:1px solid rgba(255,255,255,.18)}

/* ---------- Petits textes flottants ---------- */
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.floater{position:absolute;font-size:1.7rem;transform:translate(-50%,-50%);animation:floatUp 1.5s ease-out forwards;text-shadow:0 0 12px rgba(255,60,120,.9);will-change:transform,opacity}
.floater.txt{font-family:var(--sans);font-weight:700;font-size:1.1rem;white-space:nowrap}

#flash{position:absolute;inset:0;z-index:45;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 56%,#fff 0%,#ffd0e0 30%,rgba(255,80,140,.6) 70%,rgba(255,80,140,0) 100%)}
#flash.go{animation:flash 1.1s ease-out}
#flash.gold{background:radial-gradient(circle at 50% 50%,#fff8d6 0%,rgba(255,209,102,.7) 55%,rgba(255,209,102,0) 100%)}
#flash.gold.go{animation:flash .9s ease-out}

/* ---------- Roue ---------- */
#wheelWrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;
  opacity:0;pointer-events:none;transform:scale(.15) rotate(-260deg);z-index:6;
  transition:opacity .9s ease,transform 1.4s cubic-bezier(.2,1.25,.3,1)}
#wheelWrap.in{opacity:1;transform:none}
#wheelWrap.out{opacity:0;transform:scale(.35) translateY(-22vh) rotate(50deg);transition:opacity .9s ease-in,transform .9s ease-in}
#wheelTitle{font-family:var(--script);font-weight:400;text-align:center;line-height:1;font-size:clamp(2rem,8.5vmin,4.2rem);
  filter:drop-shadow(0 0 14px rgba(255,209,102,.5));padding:0 4vw}
#wheelTitle small{display:block;font-size:.55em;margin-top:.1em}
#wheelBox{position:relative;width:var(--ws,320px);height:var(--ws,320px);margin-top:calc(var(--ws,320px)*.07)}
#wheelBox canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 0 30px rgba(255,60,130,.55)) drop-shadow(0 10px 25px rgba(0,0,0,.6))}
#pointer{position:absolute;left:50%;top:-5.5%;width:12%;transform:translateX(-50%);transform-origin:50% 22%;z-index:3;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.6)) drop-shadow(0 0 8px rgba(255,209,102,.7))}
#pointer svg{display:block;width:100%;height:auto}
#wheelCap{font-size:clamp(1.05rem,3vmin,1.6rem);font-weight:700;text-align:center;padding:0 6vw;min-height:1.7em;text-shadow:0 0 16px rgba(255,60,120,.8);
  animation:pulseText 1.6s ease-in-out infinite}
#wheelCap.win{font-family:var(--script);font-weight:400;font-size:clamp(2.2rem,9vmin,4.4rem);animation:hintBig 1s cubic-bezier(.2,1.6,.4,1) both;color:var(--gold)}

/* ---------- Récompense ---------- */
#reward{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;
  opacity:0;pointer-events:none;transition:opacity 1.2s;padding:calc(env(safe-area-inset-top,0px) + 2.5vh) 6vw 3vh;gap:1.2vh;overflow-y:auto;z-index:7}
#reward.in{opacity:1;pointer-events:auto}
.rays{position:absolute;left:50%;top:44%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,209,102,.2) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle closest-side,#000 2%,transparent 20%);mask:radial-gradient(circle closest-side,#000 2%,transparent 20%);
  animation:spin 45s linear infinite}
#rTitle{position:relative;font-family:var(--script);font-size:clamp(2.3rem,min(11vmin,9vh),5.6rem);line-height:1;filter:drop-shadow(0 0 18px rgba(255,209,102,.6))}
#rTitle .w{display:block}
#rTitle .ch{display:inline-block;opacity:0;background:linear-gradient(180deg,#fff7d6 0%,#ffd166 45%,#ff7aa5 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:chIn .7s cubic-bezier(.2,1.9,.4,1) forwards;animation-delay:calc(var(--i)*70ms + .7s)}
#reward:not(.in) #rTitle .ch{animation:none}
#hatWrap{position:relative;width:min(50vw,25vh,250px);margin:.6vh 0}
#hat{display:block;width:100%;cursor:pointer;transform:translateY(-130vh) rotate(-35deg);filter:drop-shadow(0 12px 22px rgba(0,0,0,.55)) drop-shadow(0 0 26px rgba(255,80,140,.55));
  transform-origin:50% 90%;-webkit-tap-highlight-color:transparent}
#reward.in #hat{animation:hatDrop 1.5s .5s cubic-bezier(.25,1.55,.35,1) forwards,hatIdle 3.2s 2.1s ease-in-out infinite}
#hat .hi{transform-origin:50% 90%}
#hat .hi.honk{animation:hatHonk .6s cubic-bezier(.2,1.8,.4,1)}
#hatShadow{position:absolute;left:12%;right:12%;bottom:-3%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);opacity:0;transition:opacity 1s 1.6s}
#reward.in #hatShadow{opacity:1}
.spark{position:absolute;font-size:1.5rem;animation:twinkle 1.8s ease-in-out infinite;opacity:0;pointer-events:none}
#letter{position:relative;max-width:min(92vw,560px);padding:1.1rem 1.4rem;border-radius:22px;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 0 30px rgba(255,80,140,.12);
  font-size:clamp(.9rem,min(2.5vmin,2.1vh),1.2rem);line-height:1.5;font-weight:500;white-space:pre-line;opacity:0;transform:translateY(20px);transition:opacity 1s,transform 1s}
#letter.show{opacity:1;transform:none}
#letter .sig{display:block;margin-top:.5rem;font-family:var(--script);font-size:1.9em;line-height:1;color:var(--gold)}
#trad{font-size:.85rem;opacity:0;transition:opacity 1.2s;font-style:italic;color:#ffd6e0;max-width:min(90vw,520px)}
#trad.show{opacity:.85}
#replay{position:relative;margin-top:.6vh;padding:.85rem 1.6rem;border-radius:99px;font-weight:700;letter-spacing:.03em;font-size:1rem;
  background:linear-gradient(135deg,#ff3d7f,#c9184a);box-shadow:0 0 24px rgba(255,60,130,.6),inset 0 1px 0 rgba(255,255,255,.4);
  opacity:0;transition:opacity 1s,transform .2s}
#replay.show{opacity:1}
#replay:active{transform:scale(.94)}

@keyframes shine{to{background-position:300% 0}}
@keyframes pulseText{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
@keyframes barFlow{to{background-position:200% 0}}
@keyframes hintPop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes hintBig{0%{transform:scale(.2) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0)}15%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - 130px)) scale(1.3) rotate(var(--r))}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes chIn{0%{opacity:0;transform:translateY(60px) scale(.2) rotate(-25deg)}100%{opacity:1;transform:none}}
@keyframes hatDrop{0%{transform:translateY(-130vh) rotate(-35deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes hatIdle{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-8px)}}
@keyframes hatHonk{0%{transform:scale(1) rotate(0)}25%{transform:scale(1.25,.8) rotate(-8deg)}55%{transform:scale(.9,1.2) translateY(-30px) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(30deg)}}
@media (prefers-reduced-motion:reduce){.rays{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="bg" class="layer"></canvas>

  <div id="title">
    <h1><span class="n1 grad">Charlène</span><span class="n2 grad">mon amour</span></h1>
    <p class="sub">Appuie pour faire battre mon cœur<br>et récupère ta récompense</p>
  </div>

  <div id="hint">👆 Appuie sur mon cœur</div>
  <div id="meter"><div class="lbl"><span>Jauge d’amour</span><span id="meterTxt">0%</span></div><div class="bar"><i id="meterBar"></i></div></div>

  <div id="wheelWrap">
    <h2 id="wheelTitle" class="grad">La Roue de la Fortune<small>de l’Amour</small></h2>
    <div id="wheelBox">
      <div id="pointer"><svg viewBox="0 0 60 80"><defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffc233"/><stop offset="1" stop-color="#c98a00"/></linearGradient></defs>
        <path d="M30 78 C30 78 4 42 4 26 A26 26 0 0 1 56 26 C56 42 30 78 30 78Z" fill="url(#pg)" stroke="#8a5a00" stroke-width="2"/><circle cx="30" cy="26" r="9" fill="#e0115f" stroke="#fff3b0" stroke-width="2.5"/></svg></div>
      <canvas id="wheelCanvas"></canvas>
    </div>
    <p id="wheelCap">Appuie pour faire tourner la roue</p>
  </div>

  <div id="reward">
    <div class="rays"></div>
    <h2 id="rTitle"></h2>
    <div id="hatWrap">
      <div id="hatShadow"></div>
      <div id="hat"></div>
      <span class="spark" style="left:-6%;top:12%;animation-delay:.2s">✨</span>
      <span class="spark" style="right:-4%;top:4%;animation-delay:.9s">⭐</span>
      <span class="spark" style="left:2%;bottom:18%;animation-delay:1.3s">💖</span>
      <span class="spark" style="right:0;bottom:26%;animation-delay:.5s">✨</span>
      <span class="spark" style="left:44%;top:-8%;animation-delay:1.6s">🌟</span>
    </div>
    <div id="letter"></div>
    <p id="trad">Traduction : toutes les cases de la roue disaient exactement la même chose 😏</p>
    <button id="replay">💗 Refaire battre mon cœur</button>
  </div>

  <div id="floaters"></div>
  <div id="flash"></div>
  <canvas id="fx" class="layer"></canvas>
  <button id="mute" aria-label="Son">🔊</button>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   ✏️  À PERSONNALISER
   ===================================================================== */
const CFG = {
  taps: 15,                                   // nombre d'appuis avant que le cœur explose
  reward: ['Turlututu', 'chapeau pointu !'],  // texte de la récompense
  letter: 'Charlène,\ntu es la plus belle chose qui me soit arrivée. Mon cœur bat pour toi, et à chaque battement il te dit : « je t’aime ».\nCe chapeau n’est qu’un petit bout de fête… le vrai cadeau, c’est nous deux.',
  signature: 'Ton amoureux ❤',
  // Les cases de la roue, écrites en « langage incompréhensible »
  wheel: ['Ξωρβλ ζαχ', 'Ʒnuk-Ħel ψ', 'Кwaз’ыл ξo', 'Þrimm ǂoŋ', 'ʘblu Ϗakhi', 'Ħuɣ zeb’ó', 'Ωmeg-ǃa ђu', 'Ψíqqu vlØn'],
  winIndex: 5                                 // la case sur laquelle la roue s'arrête (toujours la même 😉)
};

/* =====================================================================
   Outils
   ===================================================================== */
const TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (a, n) => ((a % n) + n) % n;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
const smooth = t => t * t * (3 - 2 * t);

const app = $('#app'), cv = $('#bg'), ctx = cv.getContext('2d');
const fxcv = $('#fx'), fx = fxcv.getContext('2d');
const wcv = $('#wheelCanvas'), wctx = wcv.getContext('2d');
const el = { title: $('#title'), hint: $('#hint'), meter: $('#meter'), meterBar: $('#meterBar'), meterTxt: $('#meterTxt'),
  wheelWrap: $('#wheelWrap'), wheelCap: $('#wheelCap'), pointer: $('#pointer'), reward: $('#reward'), rTitle: $('#rTitle'),
  hat: $('#hat'), letter: $('#letter'), trad: $('#trad'), replay: $('#replay'), floaters: $('#floaters'), flash: $('#flash'), mute: $('#mute') };

/* =====================================================================
   Dimensions
   ===================================================================== */
let W = 0, H = 0, DPR = 1, U = 1, wsize = 320, hx = 0, hy = 0, maxHeartW = 300;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [cv, fxcv]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  U = clamp(Math.min(W, H) / 700, .7, 1.5);
  hx = W / 2; hy = H * .56;
  maxHeartW = Math.min(W * .78, H * .42);
  wsize = Math.floor(Math.min(W * .9, H * .5, 540));
  $('#wheelBox').style.setProperty('--ws', wsize + 'px');
  wcv.width = Math.round(wsize * DPR); wcv.height = Math.round(wsize * DPR);
}
window.addEventListener('resize', resize);

/* =====================================================================
   Son (WebAudio, aucun fichier externe)
   ===================================================================== */
let AC = null, master = null, muted = false;
function ac() {
  try {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      AC = new C(); master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { return null; }
  return AC;
}
function blip(f0, f1, d, type = 'sine', v = .3, delay = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  try {
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + Math.min(.012, d / 4)); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .03);
  } catch (e) {}
}
function noise(d, v, fc, delay = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  try {
    const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + delay;
    s.buffer = buf; f.type = 'lowpass'; f.frequency.value = fc; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    s.connect(f); f.connect(g); g.connect(master); s.start(t);
  } catch (e) {}
}
const sfx = {
  beat(p) { const b = 88 + p * 30; blip(b, b * .5, .17, 'sine', .9); blip(b * .85, b * .45, .15, 'sine', .7, .17); },
  pop() { blip(420, 900, .09, 'sine', .16, .06); },
  charge() { blip(160, 1500, .5, 'sawtooth', .07); blip(80, 400, .5, 'sine', .3); },
  boom() { noise(1.4, .9, 1200); blip(140, 28, 1.1, 'sine', 1); blip(900, 60, .5, 'sawtooth', .12); },
  tick() { blip(1500, 950, .035, 'square', .07); },
  spin() { noise(.7, .12, 2500); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => blip(f, f, .5, 'triangle', .22, i * .11)); blip(1568, 1568, .9, 'sine', .15, .6); },
  horn() { blip(392, 392, .2, 'sawtooth', .13); blip(587, 587, .5, 'sawtooth', .13, .2); blip(590, 600, .5, 'square', .05, .2); },
  sparkle() { blip(1200 + Math.random() * 900, 2400, .15, 'sine', .07); }
};
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* =====================================================================
   Sprites
   ===================================================================== */
const HP = [];
for (let i = 0; i <= 96; i++) {
  const t = i / 96 * TAU;
  HP.push([16 * Math.pow(Math.sin(t), 3), -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) - 2.5]);
}
function heartPath(c, k) {
  c.beginPath();
  for (let i = 0; i < HP.length; i++) i ? c.lineTo(HP[i][0] * k, HP[i][1] * k) : c.moveTo(HP[i][0] * k, HP[i][1] * k);
  c.closePath();
}
function makeSprite(size, draw) { const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size); return c; }
const bokeh = makeSprite(64, (c, s) => {
  const g = c.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,190,215,.95)'); g.addColorStop(.4, 'rgba(255,90,150,.35)'); g.addColorStop(1, 'rgba(255,60,130,0)');
  c.fillStyle = g; c.fillRect(0, 0, s, s);
});
const miniHeart = makeSprite(64, (c, s) => {
  c.translate(s / 2, s / 2); heartPath(c, s / 36);
  const g = c.createLinearGradient(-16, -16, 16, 16); g.addColorStop(0, '#ff9ebd'); g.addColorStop(1, '#ff2d6f');
  c.fillStyle = g; c.fill();

/* =====================================================================
   État
   ===================================================================== */
let state = 'beat';            // beat | boom | wheelReady | spin | win | reward

const swimmers = [], parts = [], rings = [];
const timers = [];
const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };

/* fond : bokeh + petits cœurs qui montent */
const motes = Array.from({ length: 50 }, () => ({ nx: Math.random(), ny: Math.random(), s: rand(.3, 1), v: rand(10, 30), ph: rand(0, TAU), heart: Math.random() > .55 }));

/* =====================================================================
   Spermato… petits nageurs de l'amour 💗
   ===================================================================== */
const SW_COLORS = ['#ff2d6f', '#ff4f86', '#ff6b9d', '#e0115f', '#ff85a8', '#f0245f'];
function makeSwimmer(x, y, a, sp, boom) {
  const r = rand(3.6, 5.6) * U;
  swimmers.push({ x, y, a, sp, cr: rand(55, 125) * U * (boom ? 1 : .8), r, len: r * rand(8, 11.5), ph: rand(0, TAU), wf: rand(.6, 1.6), ph2: rand(0, TAU),
    turn: rand(.6, 1.6), k: boom ? rand(1.0, 1.9) : rand(1.6, 2.4), amp: r * rand(1.6, 2.4), color: pick(SW_COLORS) });
  if (swimmers.length > 460) swimmers.splice(0, swimmers.length - 460);
}
function updateSwimmers(dt) {
  const m = 14;
  for (const s of swimmers) {
    s.sp += (s.cr - s.sp) * (1 - Math.exp(-dt * s.k));
    s.a += Math.sin(T * s.wf + s.ph2) * s.turn * dt;
    s.x += Math.cos(s.a) * s.sp * dt; s.y += Math.sin(s.a) * s.sp * dt;
    s.ph += dt * (9 + s.sp * .045);
    if (s.x < m && Math.cos(s.a) < 0) s.a = Math.PI - s.a;
    else if (s.x > W - m && Math.cos(s.a) > 0) s.a = Math.PI - s.a;
    if (s.y < m && Math.sin(s.a) < 0) s.a = -s.a;
    else if (s.y > H - m && Math.sin(s.a) > 0) s.a = -s.a;
  }
}
function drawSwimmers() {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const N = 9;
  for (const s of swimmers) {
    const dx = -Math.cos(s.a), dy = -Math.sin(s.a), nx = -dy, ny = dx;
    ctx.strokeStyle = s.color;
    let px = s.x + dx * s.r * .6, py = s.y + dy * s.r * .6;
    for (let i = 1; i <= N; i++) {
      const f = i / N, d = f * s.len, off = Math.sin(s.ph - i * .75) * s.amp * f;
      const qx = s.x + dx * d + nx * off, qy = s.y + dy * d + ny * off;
      ctx.lineWidth = Math.max(.6, s.r * .85 * (1 - f * .85));
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke();
      px = qx; py = qy;
    }
    ctx.fillStyle = s.color;
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a);
    ctx.beginPath(); ctx.ellipse(0, 0, s.r * 1.35, s.r, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(s.r * .35, -s.r * .3, s.r * .5, s.r * .25, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* =====================================================================
   Confettis / éclats / ondes de choc (canvas #fx)
   ===================================================================== */
const CONF = ['#ff2d6f', '#ffd166', '#fff', '#ff85a8', '#7b2ff7', '#06d6a0', '#4cc9f0', '#ffb703'];
function burst(x, y, n, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = o.up ? -Math.PI / 2 + rand(-.9, .9) : rand(0, TAU), sp = rand(o.min || 250, o.max || 800) * U;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: o.g || 700, rot: rand(0, TAU), vr: rand(-9, 9), w: rand(6, 12) * U, h: rand(4, 8) * U,
      c: o.colors ? pick(o.colors) : pick(CONF), shape: o.shape != null ? o.shape : (Math.random() * 3) | 0, life: 0, max: rand(2.2, 4), drag: o.drag || .992 });
  }
  if (parts.length > 900) parts.splice(0, parts.length - 900);
}
function updateParts(dt) {
  if (rainOn) {
    const n = Math.floor(dt * 55 + Math.random());
    for (let i = 0; i < n; i++) parts.push({ x: rand(0, W), y: -20, vx: rand(-40, 40), vy: rand(80, 220), g: 60, rot: rand(0, TAU), vr: rand(-6, 6), w: rand(6, 11) * U, h: rand(4, 8) * U,
      c: pick(CONF), shape: (Math.random() * 3) | 0, life: 0, max: 8, drag: .999 });
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt; p.vy += p.g * dt; p.vx *= Math.pow(p.drag, dt * 60); p.vy *= Math.pow(p.drag, dt * 60);
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.life > p.max || p.y > H + 40) parts.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.life += dt; r.r += r.vr * dt; if (r.life > r.max) rings.splice(i, 1); }
}
function drawFx() {
  fx.setTransform(DPR, 0, 0, DPR, 0, 0); fx.clearRect(0, 0, W, H);
  for (const r of rings) {
    if (r.life < 0) continue; const a = clamp(1 - r.life / r.max, 0, 1); fx.globalAlpha = a * a; fx.strokeStyle = r.c; fx.lineWidth = r.w * a + 1;
    fx.beginPath(); fx.arc(r.x, r.y, r.r, 0, TAU); fx.stroke();
  }
  for (const p of parts) {
    fx.globalAlpha = clamp((p.max - p.life) * 2, 0, 1);
    fx.save(); fx.translate(p.x, p.y); fx.rotate(p.rot);
    if (p.shape === 0) { fx.fillStyle = p.c; fx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.life * 6 + p.rot))); }
    else if (p.shape === 1) { fx.fillStyle = p.c; fx.beginPath(); fx.arc(0, 0, p.h * .7, 0, TAU); fx.fill(); }
    else { const s = p.w * 1.6; fx.drawImage(miniHeart, -s / 2, -s / 2, s, s); }
    fx.restore();
  }
  fx.globalAlpha = 1;
}

/* =====================================================================
   Le cœur
   ===================================================================== */
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const cr = mulberry(7);
const cracks = Array.from({ length: 8 }, (_, i) => {
  let a = i * TAU / 8 + cr() * .5, x = 0, y = -2; const pts = [[x, y]];
  for (let j = 0; j < 7; j++) { a += (cr() - .5) * 1.1; x += Math.cos(a) * 2.3; y += Math.sin(a) * 2.3; pts.push([x, y]); }
  return pts;
});
const beatShape = p => Math.exp(-Math.pow((p - .05) / .045, 2)) + .65 * Math.exp(-Math.pow((p - .27) / .05, 2));

function drawHeart() {
  if (!heartAlive) return;
  const prog = taps / CFG.taps;
  const bpm = 64 + 95 * prog;
  const scale = 1 + .07 * beatShape(beatPh) + .17 * pulse + .28 * charge;
  const width = (maxHeartW / 2.6) * (1 + 1.6 * gCur) * scale, k = width / 32;
  let jx = 0, jy = 0; const jit = Math.max(0, gCur - .5) * 5 + charge * 14;
  if (jit > 0) { jx = (Math.random() - .5) * jit; jy = (Math.random() - .5) * jit; }
  ctx.save(); ctx.translate(hx + jx, hy + jy);

  const aura = ctx.createRadialGradient(0, 0, k * 6, 0, 0, k * 34);
  aura.addColorStop(0, `rgba(255,50,110,${.35 + .35 * gCur + .3 * pulse})`); aura.addColorStop(1, 'rgba(255,50,110,0)');
  ctx.fillStyle = aura; ctx.fillRect(-k * 34, -k * 34, k * 68, k * 68);

  ctx.shadowColor = 'rgba(255,40,100,.9)'; ctx.shadowBlur = 25 + 45 * gCur + 30 * pulse + 40 * charge;
  heartPath(ctx, k);
  const g = ctx.createRadialGradient(-6 * k, -8 * k, 1.5 * k, 0, 0, 22 * k);
  g.addColorStop(0, '#ff9dbc'); g.addColorStop(.3, '#ff3d6e'); g.addColorStop(.75, '#d1123f'); g.addColorStop(1, '#8c0a2c');
  ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;

  ctx.save(); heartPath(ctx, k); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.34)'; ctx.beginPath(); ctx.ellipse(-8.6 * k, -8.2 * k, 4.2 * k, 2.3 * k, -.75, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.ellipse(-3.6 * k, -10.4 * k, 1.2 * k, .7 * k, -.4, 0, TAU); ctx.fill();
  const glow = clamp((gCur - .35) * 1.2, 0, 1) * .35 + charge * .8;
  if (glow > 0) {
    const ig = ctx.createRadialGradient(0, 0, 0, 0, 0, 18 * k);
    ig.addColorStop(0, `rgba(255,245,210,${glow})`); ig.addColorStop(1, 'rgba(255,245,210,0)');
    ctx.fillStyle = ig; ctx.fillRect(-20 * k, -20 * k, 40 * k, 40 * k);
  }
  if (gCur > .2) {
    ctx.strokeStyle = 'rgba(255,248,210,.95)'; ctx.shadowColor = '#fff2b0'; ctx.shadowBlur = 10; ctx.lineWidth = Math.max(1, .3 * k); ctx.lineJoin = 'round';
    cracks.forEach((pts, i) => {
      const f = clamp((gCur - (.2 + i * .07)) / .25, 0, 1); if (f <= 0) return;
      const n = 1 + f * (pts.length - 1);
      ctx.beginPath(); ctx.moveTo(pts[0][0] * k, pts[0][1] * k);
      for (let j = 1; j < pts.length && j <= Math.floor(n); j++) ctx.lineTo(pts[j][0] * k, pts[j][1] * k);
      const fl = Math.floor(n); if (fl < pts.length - 1) { const fr = n - fl; ctx.lineTo((pts[fl][0] + (pts[fl + 1][0] - pts[fl][0]) * fr) * k, (pts[fl][1] + (pts[fl + 1][1] - pts[fl][1]) * fr) * k); }
      ctx.stroke();
    });
  }
  ctx.restore(); ctx.restore();

  // ondes d'invitation tant que rien ne se passe
  if (state === 'beat' && T - lastTap > 2.2) {
    const p = ((T * .7) % 1);
    ctx.save(); ctx.translate(hx, hy); ctx.globalAlpha = (1 - p) * .55; ctx.strokeStyle = '#ff7aa5'; ctx.lineWidth = 3;
    heartPath(ctx, k * (1.05 + p * .6)); ctx.stroke(); ctx.restore();
  }
  return bpm;
}

/* =====================================================================
   Boucle de jeu : appui sur le cœur
   ===================================================================== */
const MSGS = [
  ['Boum-boum ❤', 'Il bat pour toi…', 'Encore, encore !', 'Continue…'],
  ['Mon cœur s’emballe…', 'Tu me fais un effet fou', 'Charlène ❤', 'Plus fort !'],
  ['Attention, ça chauffe !', 'Il ne va pas tenir…', 'Continue !!', 'Je t’aime !'],
  ['Il va EXPLOSER !', 'Encore un peu…!!', 'Aaah il craque !', 'Vas-y vas-y vas-y !']
];
function setHint(txt, cls) {
  el.hint.className = cls || ''; el.hint.textContent = txt; void el.hint.offsetWidth; el.hint.classList.add(cls || 'pop');
}
function floater(x, y, txt, cls) {
  const s = document.createElement('span'); s.className = 'floater ' + (cls || ''); s.textContent = txt;
  s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.setProperty('--dx', rand(-70, 70) + 'px'); s.style.setProperty('--r', rand(-30, 30) + 'deg');
  el.floaters.appendChild(s); s.addEventListener('animationend', () => s.remove());
}
function flash(gold) {
  el.flash.className = gold ? 'gold' : ''; void el.flash.offsetWidth; el.flash.classList.add('go');
  if (gold) el.flash.classList.add('gold');
}

function tap(x, y) {
  taps++; lastTap = T; pulse = 1;
  const p = taps / CFG.taps;
  sfx.beat(p); sfx.pop();
  const n = p > .6 ? 3 : p > .3 ? 2 : 1;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    makeSwimmer(hx + Math.cos(a) * 6, hy + Math.sin(a) * 6, a, rand(400, 560) * U, false);
  }
  const grp = p < .25 ? 0 : p < .55 ? 1 : p < .85 ? 2 : 3;
  floater(x, y, pick(['❤', '💖', '💗', '✨', '💘']));
  if (taps > 1 && taps % 2 === 0) floater(x + rand(-40, 40), y - 40, pick(MSGS[grp]), 'txt');
  setHint(pick(MSGS[grp]));
  const pct = Math.min(99, Math.round(p * 100));
  el.meterBar.style.width = pct + '%'; el.meterTxt.textContent = pct + '%';
  shake += 2 + p * 6; buzz(12 + taps * 2);
  if (taps >= CFG.taps) startBoom();
}

function startBoom() {
  state = 'boom'; charge = 0; sfx.charge(); buzz([30, 30, 30, 30, 60]);
  el.title.classList.add('gone'); el.meter.classList.add('gone');
  el.meterTxt.textContent = '∞%'; el.meterBar.style.width = '100%';
  setHint('💥 ATTENTION 💥', 'big');
  later(explode, 480);
}

function explode() {
  heartAlive = false; charge = 0;
  for (let i = 0; i < 270; i++) {
    const a = rand(0, TAU); makeSwimmer(hx + Math.cos(a) * 8, hy + Math.sin(a) * 8, a, rand(250, 1150) * U * (Math.random() < .15 ? 1.4 : 1), true);
  }
  for (let i = 0; i < 3; i++) rings.push({ x: hx, y: hy, r: 10, vr: 500 + i * 320, life: -i * .08, max: 1.1 + i * .2, w: 22 - i * 6, c: i === 1 ? '#ffd0e0' : '#ff4f86' });
  burst(hx, hy, 80, { shape: 2, colors: ['#fff'], min: 200, max: 1000, g: 500 });
  burst(hx, hy, 60, { min: 200, max: 900, g: 400 });
  flash(false); shake = 26; sfx.boom(); buzz([120, 40, 200]);
  setHint('Mon cœur a explosé… d’amour ❤', 'big');
  later(showWheel, 4200);
}

/* =====================================================================
   La roue de la fortune
   ===================================================================== */
const WN = CFG.wheel.length, SA = TAU / WN, POINTER = -Math.PI / 2;
const SEG = [['#e0115f', '#fff'], ['#6a1b9a', '#fff'], ['#ffb703', '#3a0a1f'], ['#ff5d8f', '#fff'], ['#3a1078', '#fff'], ['#c9184a', '#fff'], ['#ffd6e0', '#3a0a1f'], ['#8e24aa', '#fff']];

function showWheel() {
  state = 'wheelReady'; el.hint.textContent = ''; el.hint.className = '';
  el.wheelCap.className = ''; el.wheelCap.textContent = 'Appuie pour faire tourner la roue';
  el.wheelWrap.classList.add('in'); buzz(30);
}

function spin() {
  state = 'spin'; sfx.spin(); buzz(40);
  el.wheelCap.textContent = 'La roue tourne…';
  const W_ = CFG.winIndex, cur = rot;
  const tA = POINTER - (W_ + 1.1) * SA;                     // s'arrête juste AVANT la case gagnante (suspense !)
  const kk = Math.ceil((cur + 7 * TAU - tA) / TAU);
  const rA = tA + kk * TAU;
  spinPlan = { phase: 'A', t: 0, r0: cur, rA, rB: rA + .62 * SA, dA: 6.4, dP: 1.2, dB: 1.7 };
  lastIdx = segAt();
}
const segAt = () => Math.floor(mod(POINTER - rot, TAU) / SA);
const easeSpin = u => easeOutCubic(u) * smooth(clamp(u / .06, 0, 1));

function updateWheel(dt) {
  if (state === 'wheelReady') rot += dt * .3;
  if (state === 'spin' && spinPlan) {
    const s = spinPlan; s.t += dt;
    if (s.phase === 'A') {
      const u = Math.min(1, s.t / s.dA); rot = s.r0 + (s.rA - s.r0) * easeSpin(u);
      if (u >= 1) { s.phase = 'P'; s.t = 0; el.wheelCap.textContent = 'Attends… elle hésite… 😳'; }
    } else if (s.phase === 'P') {
      if (s.t > s.dP) { s.phase = 'B'; s.t = 0; }
    } else {
      const u = Math.min(1, s.t / s.dB); rot = s.rA + (s.rB - s.rA) * easeInOutSine(u);
      if (u >= 1) win();
    }
  }
  const idx = segAt();
  if (idx !== lastIdx) { lastIdx = idx; if (state === 'spin') { sfx.tick(); kick = 1; } }
  kick *= Math.exp(-dt * 11);
  if (winGlow > 0 || state !== 'beat') el.pointer.style.transform = `translateX(-50%) rotate(${kick * 32}deg)`;
  if (state === 'win' || state === 'reward') winGlow = Math.min(1, winGlow + dt * 2);
}

function win() {
  state = 'win'; spinPlan = null; rot = mod(rot, TAU);
  flash(true); sfx.win(); buzz([60, 40, 60, 40, 200]);
  el.wheelCap.className = 'win'; el.wheelCap.textContent = 'Tu as gagné ! 🎉';
  const r = el.pointer.getBoundingClientRect();
  burst(W * .1, H * .75, 90, { up: true, min: 700, max: 1500, g: 900 });
  burst(W * .9, H * .75, 90, { up: true, min: 700, max: 1500, g: 900 });
  burst(r.left + r.width / 2, r.top + r.height, 60, { min: 200, max: 700 });
  later(showReward, 2600);
}

function drawWheel() {
  const s = wsize, c = wctx; c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, s, s);
  const R = s / 2, cx = R, cy = R, Rs = R * .84;

  // jante dorée
  const rg = c.createRadialGradient(cx, cy, R * .8, cx, cy, R);
  rg.addColorStop(0, '#a86b00'); rg.addColorStop(.35, '#ffe08a'); rg.addColorStop(.7, '#ffc233'); rg.addColorStop(1, '#8a5700');
  c.fillStyle = rg; c.beginPath(); c.arc(cx, cy, R * .99, 0, TAU); c.fill();
  c.fillStyle = '#3a0a1f'; c.beginPath(); c.arc(cx, cy, Rs + R * .02, 0, TAU); c.fill();

  // quartiers
  for (let i = 0; i < WN; i++) {
    const a0 = rot + i * SA, a1 = a0 + SA;
    c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, Rs, a0, a1); c.closePath();
    c.fillStyle = SEG[i % SEG.length][0]; c.fill();
  }
  const sh = c.createRadialGradient(cx, cy, Rs * .15, cx, cy, Rs);
  sh.addColorStop(0, 'rgba(0,0,0,.45)'); sh.addColorStop(.55, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(255,255,255,.12)');
  c.fillStyle = sh; c.beginPath(); c.arc(cx, cy, Rs, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(255,225,140,.9)'; c.lineWidth = Math.max(1.5, R * .012);
  for (let i = 0; i < WN; i++) { const a = rot + i * SA; c.beginPath(); c.moveTo(cx + Math.cos(a) * R * .17, cy + Math.sin(a) * R * .17); c.lineTo(cx + Math.cos(a) * Rs, cy + Math.sin(a) * Rs); c.stroke(); }

  // texte « incompréhensible »
  c.textAlign = 'right'; c.textBaseline = 'middle'; c.font = `700 ${Math.round(R * .088)}px Quicksand, system-ui, sans-serif`;
  for (let i = 0; i < WN; i++) {
    c.save(); c.translate(cx, cy); c.rotate(rot + (i + .5) * SA);
    c.fillStyle = SEG[i % SEG.length][1]; c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 3;
    c.fillText(CFG.wheel[i], Rs * .94, 0); c.restore();
  }

  // case gagnante mise en valeur
  if (winGlow > 0) {
    for (let i = 0; i < WN; i++) {
      const a0 = rot + i * SA, a1 = a0 + SA;
      c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, Rs, a0, a1); c.closePath();
      if (i !== CFG.winIndex) { c.fillStyle = `rgba(15,0,15,${.6 * winGlow})`; c.fill(); }
      else { c.fillStyle = `rgba(255,255,255,${(.12 + .12 * Math.sin(T * 8)) * winGlow})`; c.fill(); c.strokeStyle = '#fff3b0'; c.lineWidth = R * .03 * winGlow; c.stroke(); }
    }
  }

  // ampoules
  const spinning = state === 'spin';
  const nb = 28;
  for (let i = 0; i < nb; i++) {
    const a = i / nb * TAU, on = state === 'win' || state === 'reward' ? ((i + Math.floor(T * 10)) % 2 === 0) : ((i + Math.floor(T * (spinning ? 16 : 3))) % 2 === 0);
    const bx = cx + Math.cos(a) * R * .925, by = cy + Math.sin(a) * R * .925, br = R * .03;
    if (on) { c.fillStyle = 'rgba(255,250,200,.35)'; c.beginPath(); c.arc(bx, by, br * 2.3, 0, TAU); c.fill(); }
    c.fillStyle = on ? '#fffbe0' : '#a86b00'; c.beginPath(); c.arc(bx, by, br, 0, TAU); c.fill();
  }

  // moyeu en forme de cœur
  const hp = 1 + .06 * Math.sin(T * 5) * (state === 'wheelReady' ? 1 : 0);
  const hg = c.createRadialGradient(cx - R * .04, cy - R * .04, 0, cx, cy, R * .19);
  hg.addColorStop(0, '#fff3b0'); hg.addColorStop(.6, '#ffc233'); hg.addColorStop(1, '#b37800');
  c.fillStyle = hg; c.beginPath(); c.arc(cx, cy, R * .17 * hp, 0, TAU); c.fill();
  c.save(); c.translate(cx, cy); heartPath(c, R * .0043 * hp); c.fillStyle = '#e0115f'; c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 4; c.fill(); c.restore();
}

/* =====================================================================
   Récompense : le chapeau pointu
   ===================================================================== */
function buildHat() {
  let stripes = '', dots = '', fringe = '', pom = '';
  for (let i = 0; i < 6; i++) stripes += `<rect x="-40" y="${70 + i * 46}" width="300" height="17" fill="${i % 2 ? '#fff' : '#ffd166'}"/>`;
  [[110, 80], [86, 122], [140, 138], [64, 188], [118, 200], [160, 214], [40, 246], [96, 252], [150, 262]].forEach(([x, y]) => dots += `<circle cx="${x}" cy="${y}" r="5.5" fill="#fff" opacity=".9"/>`);
  for (let i = 0; i <= 9; i++) { const t = i / 9, x = 26 + t * 168, y = 268 + 64 * t * (1 - t) * .9 + 4; fringe += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="url(#pom)"/>`; }
  for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; pom += `<circle cx="${(110 + Math.cos(a) * 15).toFixed(1)}" cy="${(30 + Math.sin(a) * 15).toFixed(1)}" r="10" fill="url(#pom)"/>`; }
  el.hat.innerHTML = `<div class="hi"><svg viewBox="0 0 220 305" xmlns="http://www.w3.org/2000/svg"><defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7fb0"/><stop offset=".5" stop-color="#ff2d75"/><stop offset="1" stop-color="#a80f48"/></linearGradient>
    <radialGradient id="pom" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fffbe6"/><stop offset=".55" stop-color="#ffd166"/><stop offset="1" stop-color="#d98e0a"/></radialGradient>
    <linearGradient id="shade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></linearGradient>
    <clipPath id="cone"><path d="M110 40 L26 268 Q110 300 194 268 Z"/></clipPath></defs>
    <g clip-path="url(#cone)"><rect width="220" height="305" fill="url(#hg)"/><g transform="rotate(-22 110 170)" opacity=".95">${stripes}</g>${dots}<rect width="220" height="305" fill="url(#shade)"/></g>
    <path d="M26 268 Q110 300 194 268" fill="none" stroke="#ffe08a" stroke-width="5" stroke-linecap="round"/>
    ${fringe}${pom}<circle cx="110" cy="30" r="17" fill="url(#pom)"/></svg></div>`;
}

function showReward() {
  state = 'reward';
  el.wheelWrap.classList.add('out');
  buildHat();
  el.rTitle.innerHTML = CFG.reward.map((w, wi) => `<span class="w">${[...w].map((ch, i) => `<span class="ch" style="--i:${wi * 9 + i}">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('')}</span>`).join('');
  el.reward.classList.add('in');
  later(() => { rainOn = true; flash(true); sfx.win(); burst(W / 2, H * .4, 120, { min: 300, max: 1100, g: 800 }); }, 700);
  later(() => { sfx.horn(); burst(W / 2, H * .5, 60, { up: true, min: 500, max: 1100, g: 800 }); }, 1900);
  later(() => { el.letter.classList.add('show'); typeLetter(); }, 2600);
}
function typeLetter() {
  const txt = CFG.letter; let i = 0; el.letter.textContent = '';
  const node = document.createTextNode(''); el.letter.appendChild(node);
  const sig = document.createElement('span'); sig.className = 'sig'; sig.textContent = CFG.signature; sig.style.opacity = 0;
  el.letter.appendChild(sig);
  (function step() {
    if (state !== 'reward') return;
    i += 2; node.nodeValue = txt.slice(0, i);
    if (i < txt.length) later(step, 34);
    else { sig.style.transition = 'opacity 1s'; sig.style.opacity = 1; later(() => { el.trad.classList.add('show'); el.replay.classList.add('show'); }, 1200); }
  })();
}
function honk() {
  const hi = el.hat.firstElementChild; hi.classList.remove('honk'); void hi.offsetWidth; hi.classList.add('honk');
  sfx.horn(); buzz([40, 30, 80]);
  const r = el.hat.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height * .2, 70, { min: 300, max: 1000, g: 800 });
  for (let i = 0; i < 4; i++) floater(r.left + rand(0, r.width), r.top + rand(0, r.height * .5), pick(['🎉', '🎊', '💖', '✨', '🎩']));
}

/* =====================================================================
   Recommencer
   ===================================================================== */
function reset() {
  timers.splice(0).forEach(clearTimeout);
  state = 'beat'; taps = 0; gCur = 0; pulse = 0; charge = 0; lastTap = T; winGlow = 0; rainOn = false; heartAlive = true; spinPlan = null; rot = 0;
  swAlpha = 1; swimmers.length = 0; parts.length = 0; rings.length = 0;
  el.reward.classList.remove('in'); el.wheelWrap.classList.remove('in', 'out');
  el.letter.classList.remove('show'); el.trad.classList.remove('show'); el.replay.classList.remove('show'); if (el.hat.firstElementChild) el.hat.firstElementChild.classList.remove('honk');
  el.title.classList.remove('gone'); el.meter.classList.remove('gone');
  el.meterBar.style.width = '0'; el.meterTxt.textContent = '0%';
  setHint('👆 Appuie sur mon cœur');
}

/* =====================================================================
   Entrées
   ===================================================================== */
app.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  ac();
  if (state === 'beat') tap(e.clientX, e.clientY);
  else if (state === 'wheelReady') spin();
  else if (state === 'reward') {
    if (e.target.closest('#hat')) honk();
    else { burst(e.clientX, e.clientY, 22, { min: 150, max: 500, g: 600 }); floater(e.clientX, e.clientY, pick(['❤', '💖', '💗', '✨', '💘'])); sfx.sparkle(); }
  }
});
window.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (e.target.closest && e.target.closest('button')) return;
  e.preventDefault(); ac();
  if (state === 'beat') tap(hx, hy); else if (state === 'wheelReady') spin();
});
el.replay.addEventListener('click', () => { ac(); reset(); });
el.mute.addEventListener('click', () => { muted = !muted; el.mute.textContent = muted ? '🔇' : '🔊'; if (!muted) ac(); });

/* =====================================================================
   Boucle principale
   ===================================================================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  const prog = taps / CFG.taps;

  // mises à jour
  gCur += (prog - gCur) * (1 - Math.exp(-dt * 9));
  pulse *= Math.exp(-dt * 7);
  if (state === 'boom') charge = Math.min(1, charge + dt / .48);
  beatPh = (beatPh + dt * (64 + 95 * prog) / 60) % 1;
  updateSwimmers(dt); updateParts(dt); updateWheel(dt);

  if (shake > .05) { app.style.transform = `translate(${(Math.random() - .5) * shake}px,${(Math.random() - .5) * shake}px)`; shake *= Math.exp(-dt * 5); }
  else if (shake !== 0) { shake = 0; app.style.transform = ''; }

  // rendu du décor
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  for (const m of motes) {
    const y = mod(m.ny * H - T * m.v, H + 60) - 30, x = m.nx * W + Math.sin(T * .5 + m.ph) * 14, sz = 10 + m.s * 34;
    ctx.globalAlpha = .55 * m.s * (.6 + .4 * Math.sin(T * .9 + m.ph));
    ctx.drawImage(m.heart ? miniHeart : bokeh, x - sz / 2, y - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;
  swAlpha += ((state === 'reward' ? .3 : state === 'win' ? .55 : 1) - swAlpha) * (1 - Math.exp(-dt * 1.5));
  ctx.globalAlpha = swAlpha; drawSwimmers(); ctx.globalAlpha = 1;
  drawHeart();
  if ((el.wheelWrap.classList.contains('in') && !el.wheelWrap.classList.contains('out'))) drawWheel();
  drawFx();
  requestAnimationFrame(frame);
}

resize();
buildHat();
requestAnimationFrame(frame);

// petit accès de debug (utile pour les tests) : window.__love
window.__love = { get state() { return state; }, tap: () => tap(hx, hy), spin, cfg: CFG };
})();
</script>
